<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #07090f;
        --ink: #f2f5fa;
        --cyan: #4ce1ff;
        --violet: #8b5cff;
        --muted: #8a93a6;
        --font-display: "Archivo Black", sans-serif;
        --font-body: "Outfit", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
        color: var(--ink);
        font-family: var(--font-body);
      }
      #film,
      #fade {
        position: absolute;
        inset: 0;
      }

      /* ── background layers ── */
      .glow {
        position: absolute;
        width: 1400px;
        height: 1400px;
        border-radius: 50%;
        filter: blur(40px);
      }
      #glow-a {
        left: -520px;
        top: -360px;
        background: radial-gradient(circle, rgba(139, 92, 255, 0.34) 0%, rgba(139, 92, 255, 0) 65%);
      }
      #glow-b {
        right: -560px;
        bottom: -420px;
        background: radial-gradient(circle, rgba(76, 225, 255, 0.26) 0%, rgba(76, 225, 255, 0) 65%);
      }
      #net {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #net line {
        stroke: var(--cyan);
        stroke-width: 1.5;
        stroke-opacity: 0.28;
      }
      #net circle {
        fill: var(--cyan);
      }
      #binary {
        position: absolute;
        left: 60px;
        top: 260px;
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 150px;
        line-height: 1.05;
        color: var(--ink);
        opacity: 0.06;
        white-space: nowrap;
      }

      /* ── edge rails ── */
      .rail {
        position: absolute;
        left: 88px;
        right: 88px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: var(--font-mono);
        font-size: 30px;
        letter-spacing: 0.12em;
        color: var(--muted);
        text-transform: uppercase;
      }
      #rail-top {
        top: 110px;
      }
      #rail-bottom {
        bottom: 110px;
      }
      #rail-top .dot {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--cyan);
        margin-right: 18px;
        vertical-align: middle;
      }
      #counter {
        position: relative;
        width: 120px;
        height: 36px;
        text-align: right;
      }
      #counter span {
        position: absolute;
        right: 0;
        top: 0;
        color: var(--ink);
      }
      #progress {
        position: absolute;
        left: 88px;
        right: 88px;
        bottom: 170px;
        height: 4px;
        background: rgba(242, 245, 250, 0.1);
      }
      #progress-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, var(--violet), var(--cyan));
        transform-origin: left center;
      }

      /* ── scenes ── */
      .scene {
        position: absolute;
        inset: 0;
      }
      .scene-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 260px 88px;
        gap: 28px;
      }
      .kicker {
        font-family: var(--font-mono);
        font-size: 34px;
        letter-spacing: 0.14em;
        color: var(--cyan);
        text-transform: uppercase;
      }
      .line {
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 96px;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }
      .line .w {
        display: inline-block;
        margin-right: 0.22em;
      }
      .hero {
        font-family: var(--font-display);
        font-size: 120px;
        line-height: 0.95;
        letter-spacing: -0.03em;
        display: inline-block;
      }
      .rule {
        width: 520px;
        height: 10px;
        background: linear-gradient(90deg, var(--violet), var(--cyan));
        transform-origin: left center;
      }
      #s2,
      #s3,
      #s4 {
        visibility: hidden;
        opacity: 0;
      }
      #s2 .hero {
        color: var(--ink);
      }
      #s3 .scene-content {
        align-items: flex-start;
      }
      #ai {
        font-family: var(--font-display);
        font-size: 560px;
        line-height: 0.82;
        letter-spacing: -0.05em;
        color: var(--ink);
        display: inline-block;
      }
      #ai-sub {
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 76px;
        letter-spacing: -0.01em;
      }
      #ai-note {
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 44px;
        color: rgba(242, 245, 250, 0.7);
        max-width: 820px;
        line-height: 1.3;
      }
      #s4 .hero {
        color: var(--cyan);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="film" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div id="fade">
        <div id="glow-a" class="glow"></div>
        <div id="glow-b" class="glow"></div>
        <svg id="net" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <g id="net-lines"></g>
          <g id="net-nodes"></g>
        </svg>
        <div id="binary" data-layout-allow-overlap="true">01001<br />10110<br />00101<br />11010<br />01101<br />10011<br />01110</div>

        <div id="rail-top" class="rail">
          <div><span class="dot"></span>Susuka · AI</div>
          <div id="counter">
            <span id="c1">01/04</span><span id="c2" style="visibility: hidden">02/04</span
            ><span id="c3" style="visibility: hidden">03/04</span
            ><span id="c4" style="visibility: hidden">04/04</span>
          </div>
        </div>

        <!-- Scene 1: hook -->
        <div id="s1" class="scene">
          <div class="scene-content">
            <div class="kicker" id="s1-k">// 1950-an</div>
            <div class="line"><span class="w">Dulu,</span><span class="w">mesin</span><span class="w">hanya</span></div>
            <div class="hero" id="s1-hero">MENGHITUNG.</div>
          </div>
        </div>

        <!-- Scene 2: build -->
        <div id="s2" class="scene">
          <div class="scene-content">
            <div class="kicker" id="s2-k">// Hari ini</div>
            <div class="line"><span class="w">Sekarang,</span><span class="w">mesin</span></div>
            <div class="hero" id="s2-hero">BELAJAR.</div>
            <div class="rule" id="s2-rule"></div>
          </div>
        </div>

        <!-- Scene 3: punch -->
        <div id="s3" class="scene">
          <div class="scene-content">
            <div id="ai">AI</div>
            <div class="rule" id="s3-rule"></div>
            <div id="ai-sub">Kecerdasan Buatan</div>
          </div>
        </div>

        <!-- Scene 4: resolve -->
        <div id="s4" class="scene">
          <div class="scene-content">
            <div class="kicker" id="s4-k">// Masa depan</div>
            <div class="line"><span class="w">Gunakan</span><span class="w">dengan</span></div>
            <div class="hero" id="s4-hero">BIJAK.</div>
          </div>
        </div>

        <div id="progress"><div id="progress-fill"></div></div>
        <div id="rail-bottom" class="rail">
          <div>Kecerdasan Buatan</div>
          <div>2026</div>
        </div>
        </div>
      </div>
    </div>

    <script>
      // Deterministic neural-network field (seeded LCG, no Math.random).
      (function buildNet() {
        let seed = 7;
        const rand = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
        const nodes = [];
        const cols = 5, rows = 9;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            nodes.push({ x: 90 + c * 225 + (rand() - 0.5) * 140, y: 120 + r * 215 + (rand() - 0.5) * 120 });
          }
        }
        const NS = "http://www.w3.org/2000/svg";
        const lines = document.getElementById("net-lines");
        const dots = document.getElementById("net-nodes");
        nodes.forEach((a, i) => {
          nodes.forEach((b, j) => {
            if (j <= i) return;
            const d = Math.hypot(a.x - b.x, a.y - b.y);
            if (d < 300 && rand() > 0.35) {
              const l = document.createElementNS(NS, "line");
              l.setAttribute("x1", a.x); l.setAttribute("y1", a.y);
              l.setAttribute("x2", b.x); l.setAttribute("y2", b.y);
              l.setAttribute("pathLength", "1");
              l.setAttribute("stroke-dasharray", "1");
              l.setAttribute("stroke-dashoffset", "1");
              lines.appendChild(l);
            }
          });
          const c = document.createElementNS(NS, "circle");
          c.setAttribute("cx", a.x); c.setAttribute("cy", a.y);
          c.setAttribute("r", 5 + Math.round(rand() * 4));
          c.setAttribute("opacity", "0");
          dots.appendChild(c);
        });
      })();

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const lines = gsap.utils.toArray("#net line");
      const dots = gsap.utils.toArray("#net circle");

      // ── ambient, whole film ──
      tl.fromTo("#progress-fill", { scaleX: 0 }, { scaleX: 1, duration: 10, ease: "none" }, 0);
      tl.fromTo("#glow-a", { x: 0, y: 0 }, { x: 160, y: 220, duration: 10, ease: "sine.inOut" }, 0);
      tl.fromTo("#glow-b", { x: 0, y: 0 }, { x: -140, y: -180, duration: 10, ease: "sine.inOut" }, 0);
      tl.fromTo("#rail-top, #rail-bottom", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: "power1.out" }, 0.1);
      tl.fromTo(dots, { opacity: 0 }, { opacity: 0.18, duration: 0.8, stagger: { each: 0.015, from: "random" }, ease: "sine.out" }, 0.2);

      // ── S1 hook (0 → 2.4): mechanical, binary drifts ──
      tl.fromTo("#binary", { y: 0 }, { y: -260, duration: 2.4, ease: "none" }, 0);
      tl.fromTo("#s1-k", { autoAlpha: 0, x: -60 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0.2);
      tl.fromTo("#s1 .w", { autoAlpha: 0, x: -80 }, { autoAlpha: 1, x: 0, duration: 0.3, stagger: 0.09, ease: "power4.out" }, 0.3);
      tl.fromTo("#s1-hero", { autoAlpha: 0, scaleX: 1.35, transformOrigin: "0% 50%" }, { autoAlpha: 1, scaleX: 1, duration: 0.7, ease: "expo.out" }, 0.75);
      tl.fromTo("#binary", { opacity: 0.06 }, { opacity: 0, duration: 0.2, ease: "power2.in" }, 2.2);

      // ── S2 build (hard cut at 2.4): network draws on ──
      tl.set("#s1", { autoAlpha: 0 }, 2.4);
      tl.set("#s2", { autoAlpha: 1 }, 2.4);
      tl.set("#c1", { autoAlpha: 0 }, 2.4);
      tl.set("#c2", { autoAlpha: 1 }, 2.4);
      tl.fromTo(lines, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.4, stagger: { each: 0.012, from: "center" }, ease: "power2.out" }, 2.45);
      tl.fromTo(dots, { opacity: 0.18 }, { opacity: 0.75, immediateRender: false, duration: 0.6, stagger: { each: 0.01, from: "center" }, ease: "sine.out" }, 2.6);
      tl.fromTo("#s2-k", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.55);
      tl.fromTo("#s2 .w", { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 0.45, stagger: 0.12, ease: "back.out(1.6)" }, 2.65);
      tl.fromTo("#s2-hero", { autoAlpha: 0, filter: "blur(18px)", scale: 1.08 }, { autoAlpha: 1, filter: "blur(0px)", scale: 1, duration: 0.8, ease: "circ.out" }, 3.1);
      tl.fromTo("#s2-hero", { color: "#f2f5fa" }, { color: "#4ce1ff", duration: 0.5, ease: "sine.inOut" }, 3.9);
      tl.fromTo("#s2-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 3.9);
      tl.fromTo("#s2", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 4.75);

      // ── S3 punch (5.0 → 7.6): AI slam + glow ──
      tl.set("#s3", { autoAlpha: 1 }, 5.0);
      tl.set("#c2", { autoAlpha: 0 }, 5.0);
      tl.set("#c3", { autoAlpha: 1 }, 5.0);
      tl.fromTo("#ai", { y: -520, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.32, ease: "power4.out" }, 5.0);
      tl.to("#ai", { keyframes: [{ x: -14 }, { x: 12 }, { x: -6 }, { x: 0 }], duration: 0.22, ease: "none" }, 5.32);
      tl.fromTo("#ai", { textShadow: "0 0 0px rgba(76,225,255,0)" }, { textShadow: "0 0 70px rgba(76,225,255,0.85)", duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, 5.35);
      tl.fromTo(dots, { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.8, immediateRender: false, duration: 0.3, yoyo: true, repeat: 1, stagger: { each: 0.008, from: "center" }, ease: "sine.inOut" }, 5.3);
      tl.fromTo("#s3-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "expo.out" }, 5.55);
      tl.fromTo("#ai-sub", { autoAlpha: 0, x: 120 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 5.7);
      tl.fromTo("#ai", { scale: 1, transformOrigin: "0% 100%" }, { scale: 1.03, duration: 1.8, ease: "sine.inOut" }, 5.6);
      tl.fromTo("#s3", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 7.1);

      // ── S4 resolve (7.4 → 10): calm close ──
      tl.set("#s4", { autoAlpha: 1 }, 7.4);
      tl.set("#c3", { autoAlpha: 0 }, 7.4);
      tl.set("#c4", { autoAlpha: 1 }, 7.4);
      tl.fromTo(dots, { opacity: 0.75 }, { opacity: 0.3, immediateRender: false, duration: 1.0, ease: "sine.inOut" }, 7.4);
      tl.fromTo("#s4-k", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "sine.out" }, 7.45);
      tl.fromTo("#s4 .w", { autoAlpha: 0, y: 120 }, { autoAlpha: 1, y: 0, duration: 0.7, stagger: 0.15, ease: "power4.out" }, 7.5);
      tl.fromTo("#s4-hero", { autoAlpha: 0, y: 140 }, { autoAlpha: 1, y: 0, duration: 0.8, ease: "expo.out" }, 7.6);
      tl.fromTo("#s4-hero", { scale: 1, transformOrigin: "0% 50%" }, { scale: 1.1, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 8.4);
      tl.fromTo("#fade", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, 9.7);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
